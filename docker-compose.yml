name: wikime

services:
  # =========================================================================
  # Core Infrastructure Services
  # =========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: wikime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wikime}
      POSTGRES_USER: ${POSTGRES_USER:-wikime_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wikime_dev_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wikime-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wikime_dev} -d ${POSTGRES_DB:-wikime}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:latest
    container_name: wikime-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
      - "${REDIS_UI_PORT:-8001}:8001"
    volumes:
      - redis_data:/data
    networks:
      - wikime-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: wikime-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_REST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - wikime-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Application Services (Commented-out stubs for local development)
  # Uncomment when individual service implementations are ready.
  # =========================================================================

  # wikime-backend:
  #   build:
  #     context: ./services/wikime-backend
  #     dockerfile: Dockerfile
  #   container_name: wikime-backend
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - DATABASE_URL=postgresql://wikime_dev:wikime_dev_secret@postgres:5432/wikime
  #     - REDIS_URL=redis://redis:6379/0
  #     - QDRANT_REST_URL=http://qdrant:6333
  #     - QDRANT_GRPC_URL=http://qdrant:6334
  #     - AI_SERVICE_URL=http://wikime-ai:8080
  #   volumes:
  #     - ./services/wikime-backend:/app
  #   networks:
  #     - wikime-network
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     qdrant:
  #       condition: service_healthy

  # wikime-ai:
  #   build:
  #     context: ./services/wikime-ai
  #     dockerfile: Dockerfile
  #   container_name: wikime-ai
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - REDIS_URL=redis://redis:6379/0
  #     - QDRANT_REST_URL=http://qdrant:6333
